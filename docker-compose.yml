services:
  backend:
    build:
      context: ./careconnect-backend
      dockerfile: Dockerfile
    container_name: careconnect-backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=default
    restart: unless-stopped

  frontend:
    build:
      context: ./careconnect-react
      dockerfile: Dockerfile
    container_name: careconnect-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
