# ==============================================================================
# CareConnect EHR Spring Boot Configuration (Default Profile: H2 Zero-Config)
# Dynamic Port support for Render / Railway / Localhost
server.port=${PORT:8080}

# Spring Application Name
spring.application.name=careconnect-backend

# Data Source: In-Memory H2 (Instant startup, zero setup required)
spring.datasource.url=jdbc:h2:mem:careconnectdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password

# H2 Web Console (Available at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# SpringDoc OpenAPI / Swagger UI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# CORS Allowed Origins
careconnect.cors.allowed-origins=http://localhost:5173,https://careconnect-ehr.vercel.app,*
