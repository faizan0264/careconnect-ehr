# ==============================================================================
# CareConnect EHR Profile: Oracle Database Connection
# Activate via: java -jar -Dspring.profiles.active=oracle careconnect-backend.jar
# ==============================================================================
spring.datasource.url=jdbc:oracle:thin:@localhost:1521/XE
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.datasource.username=careconnect_admin
spring.datasource.password=CareConnectPass123

# Hibernate Oracle Dialect
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
